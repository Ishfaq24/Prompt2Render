# Default harness plugin configuration.
#
# Any plugin can be disabled here with no code change (the loader's whole point). `gate_override`
# is null by default, meaning "use the plugin's own is_gate() default" — set true/false here to
# override it per run without touching code, e.g. for the ablation runner's ON/OFF matrix
# (docs/MIGRATION_INVENTORY.md Stage 5).

generator_voice:
  enabled: true
  gate_override: null
  kokoro_voice: am_eric
  kokoro_speed: 1.0

generator_align:
  enabled: true
  gate_override: null

planner_script:
  enabled: true
  gate_override: true
  force: false

chunker_scene:
  enabled: true
  gate_override: true

planner_pedagogy:
  enabled: true
  gate_override: true

reviser_script:
  enabled: true
  gate_override: true
  max_revisions: 2

verifier_pedagogy:
  enabled: true
  gate_override: true

verifier_storyboard:
  enabled: true
  gate_override: true

verifier_animation_ir:
  enabled: true
  gate_override: true

planner_semantic:
  enabled: true
  gate_override: false   # advisory -- see planner_semantic/__init__.py's docstring
                          # (fixed after a production run showed a hard gate here
                          # could halt the default stills path over unenriched-only
                          # semantic content nothing on that path even reads)

planner_temporal:
  enabled: true
  gate_override: false   # advisory -- see planner_temporal.py's docstring

planner_llm:
  enabled: true           # one video-level LLM storyboard call
  gate_override: true

planner_visual:
  enabled: true           # deterministic topic-agnostic animation contract
  gate_override: true

planner_audio:
  enabled: true           # real: ingests already-produced voice/align timing
  gate_override: null

retriever_manim_rag:
  enabled: true            # Tier 2 Phase 7: real Manim-relevant patterns, wired into
                            # GeneratorManimPlugin's prompts (renderer_manim._pattern_hints).
                            # Deterministic/free (no LLM, no embeddings) and scoped entirely to
                            # the already-experimental --manim path -- safe to default on.
  gate_override: null

generator_code:
  enabled: true            # real: wraps scenes.generate_all
  gate_override: null

# Tier 2 Phase 8-9: generator_manim is now a normal REGISTRY entry (F13
# fixed). Alternative backend to generator_code; both declare code_artifacts,
# so exactly one may be enabled at a time -- the same effect-collision
# mechanism that already governs renderer_stills/renderer_manim below.
generator_manim:
  enabled: false
  gate_override: null
  use_motion_compiler: false   # Tier 2 Phase 4: opt in to the deterministic
                                # motion compiler instead of freehand LLM
                                # choreography. Default off.
  use_construction_dsl: false  # Tier 2 Phase 6: opt in to the schema-validated
                                # construction DSL instead of freehand LLM object
                                # construction. Only takes effect when
                                # use_motion_compiler is also true. Default off.

verifier_semantic:
  enabled: true              # real: LLM pedagogical critic for domain logic (e.g. Hanoi rules)
  gate_override: true

verifier_execution:
  enabled: true              # real: deterministic AST-based execution verifier
  gate_override: true

verifier_cognitive:
  enabled: true              # Mayer-Sweller cognitive load & attention signaling verifier
  gate_override: null        # advisory by default

# Tier 3 Phase 11 (F3/F4): deterministic-CV-only visual grounding, no VLM.
# Samples the rendered Manim clip at each state's settled timestamp (from
# temporal_ir when available, evenly-spaced fallback otherwise) and measures
# non-background pixel coverage via cv2 -- populates RenderArtifact.audit for
# Manim stems so verifier_spatial (below) stops unconditionally reporting
# skip there (F4). No-op on the stills path (scenekit already sets .audit
# there). Only meaningful in --manim mode; disabled by default like the
# other Manim-only plugins, flipped on by the --manim CLI flag.
observer_visual:
  enabled: false
  gate_override: null    # advisory -- see observer_visual/__init__.py's docstring
  min_ink_fraction: 0.002
  sample_fallback_count: 5

verifier_spatial:
  enabled: true              # real: wraps RenderArtifact.audit's recorded verdict
                              # (SceneKit on stills, observer_visual on Manim)
  gate_override: null

verifier_layout:
  enabled: true              # deterministic layout gate: caption collision, crowding, out_of_bounds
  gate_override: true        # BLOCKING for layout violations, WARNING for near margin

# Tier 3 Phase 12 ("motion traces"): the first producer of quality_report.py's
# "motion" dimension (zero producers since Phase 10 shipped that dimension).
# Reads RenderArtifact.motion (observer_visual's raw per-state frame deltas)
# and decides warn/pass itself, suppressing hold-flagged states. Only
# meaningful in --manim mode; disabled by default like observer_visual,
# flipped on by the --manim CLI flag.
verifier_motion:
  enabled: false
  gate_override: null    # advisory -- see verifier_motion/__init__.py's docstring
  min_motion_delta: 0.001

verifier_lifecycle:
  enabled: true               # always-[] shell, per the migration brief
  gate_override: false

verifier_temporal:
  enabled: true               # real: ffprobe'd clip duration vs narration span
  gate_override: true         # a clip that does not match its narration is a
                              # hard failure -- this was the plugin's own
                              # _default_gate() all along, but the entry was
                              # missing from this file entirely, so the gate
                              # was invisible here and the ablation runner
                              # could not neutralise it.
  # tolerance_seconds: 1.5    # default; raise to loosen the duration match

verifier_audio:
  enabled: true                # real: wraps qc.py's caption-drift gate (whole-video scoped)
  gate_override: null

renderer_stills:
  enabled: true                 # real: wraps stills.render_many — the actual live renderer
  gate_override: null

renderer_manim:
  enabled: false          # alternative backend to renderer_stills; both declare
                          # the same render_artifacts effect, so exactly one may
                          # be enabled at a time (the CLI's --manim flag flips
                          # this on and renderer_stills off together)
  gate_override: true

# Tier 2 Phase 8-9 (F12): assembles Manim's per-section clips straight into
# out/final.mp4 via finish.finish_manim -- bypasses generator_timeline/
# renderer_encode entirely (those are stills-only: they plan/encode one clip
# per still-image transition, a shape Manim's own renderer never produces).
# Declares final_video, same as renderer_finish -- exactly one of the two
# may be enabled at a time, same effect-collision mechanism as above.
renderer_manim_finish:
  enabled: false
  gate_override: null
  burn: false

# Tier 2 Phase 8-9 (F12): deliberately smaller-scoped than verifier_final_qc
# (qc.check() re-inspects stills-specific .py scene modules that don't exist
# in Manim mode) -- checks out/final.mp4 exists with video+audio streams.
verifier_manim_final_qc:
  enabled: false
  gate_override: true


feedback_hitl:
  enabled: true                   # manual/async — never blocks an automated run
  gate_override: false

# Tier 4 (HUMAN_APPROVAL mode): disabled by default -- toggled on by
# --hitl-mode human_approval (prompt2render.py's cmd_harness). Reuses
# hitl_feedback.json's existing "accept" semantics (harness/hitl.py); no new
# file, no new schema. gate_override left null so the plugin's own
# _default_gate() (True -- deliberate exception, see its docstring) governs
# whenever this mode is actually selected.
verifier_hitl_approval:
  enabled: false
  gate_override: null

generator_timeline:
  enabled: true
  gate_override: null

renderer_encode:
  enabled: true
  gate_override: null
  jobs: null

renderer_finish:
  enabled: true
  gate_override: null
  burn: false

verifier_final_qc:
  enabled: true
  gate_override: true
  strict: false

generator_publish:
  enabled: true
  gate_override: true

repair_router:
  enabled: true                    # event subscriber, not a pipeline stage — see its own docstring
  gate_override: false
  max_repairs_per_scene: 3         # read by harness/loader.py -> RepairController
  max_total_repairs: 12
