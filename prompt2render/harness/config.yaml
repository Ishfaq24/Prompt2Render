# Default harness plugin configuration.
#
# Any plugin can be disabled here with no code change (the loader's whole point). `gate_override`
# is null by default, meaning "use the plugin's own is_gate() default" — set true/false here to
# override it per run without touching code, e.g. for the ablation runner's ON/OFF matrix
# (docs/MIGRATION_INVENTORY.md Stage 5).

chunker_scene:
  enabled: true
  gate_override: null

planner_llm:
  enabled: true          # passthrough only — no live LLM planning call exists (see its docstring)
  gate_override: null

planner_visual:
  enabled: false          # no-op stub, no live visual-planning call exists
  gate_override: null

planner_audio:
  enabled: true           # real: ingests already-produced voice/align timing
  gate_override: null

retriever_manim_rag:
  enabled: false           # no-op stub, no RAG exists anywhere in prompt2render
  gate_override: null

generator_code:
  enabled: true            # real: wraps scenes.generate_all
  gate_override: null

verifier_semantic:
  enabled: true             # stub — runs, finds nothing (no live semantic checker)
  gate_override: false

verifier_spatial:
  enabled: true              # real: wraps scenekit.audit()'s recorded verdict
  gate_override: null

verifier_lifecycle:
  enabled: true               # always-[] shell, per the migration brief
  gate_override: false

verifier_audio:
  enabled: true                # real: wraps qc.py's caption-drift gate (whole-video scoped)
  gate_override: null

renderer_stills:
  enabled: true                 # real: wraps stills.render_many — the actual live renderer
  gate_override: null

renderer_manim:
  enabled: false                 # opt-in escape hatch, disabled by default (Stage 0 §5)
  gate_override: null

feedback_hitl:
  enabled: true                   # manual/async — never blocks an automated run
  gate_override: false

repair_router:
  enabled: true                    # event subscriber, not a pipeline stage — see its own docstring
  gate_override: false
  max_repair_cycles: 3
