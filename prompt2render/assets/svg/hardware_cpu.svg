<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- CPU Core Boundary -->
  <rect x="15" y="15" width="70" height="70" rx="8" ry="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <!-- Internal Die / Core -->
  <rect x="28" y="28" width="44" height="44" rx="4" ry="4" fill="#0d1117" stroke="#1f6feb" stroke-width="2"/>
  <!-- CPU Text -->
  <text x="50" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">CPU</text>
  <!-- Top Pins -->
  <line x1="30" y1="5" x2="30" y2="15" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="5" x2="50" y2="15" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="5" x2="70" y2="15" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom Pins -->
  <line x1="30" y1="85" x2="30" y2="95" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="85" x2="50" y2="95" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="85" x2="70" y2="95" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <!-- Left Pins -->
  <line x1="5" y1="30" x2="15" y2="30" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="5" y1="50" x2="15" y2="50" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="5" y1="70" x2="15" y2="70" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Pins -->
  <line x1="85" y1="30" x2="95" y2="30" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="50" x2="95" y2="50" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="70" x2="95" y2="70" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
</svg>
