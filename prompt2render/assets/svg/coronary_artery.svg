<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lumenGrad" cx="45%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="70%" stop-color="#550000" />
      <stop offset="100%" stop-color="#2B0000" />
    </radialGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4E69" />
      <stop offset="50%" stop-color="#22223B" />
      <stop offset="100%" stop-color="#1B1D2E" />
    </linearGradient>
    <linearGradient id="plaqueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A7" />
      <stop offset="50%" stop-color="#DDA15E" />
      <stop offset="100%" stop-color="#99582A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0B0F19" rx="16" />

  <!-- Outer Arterial Tunica Externa (Adventitia) -->
  <circle cx="400" cy="300" r="230" fill="url(#wallGrad)" stroke="#6C757D" stroke-width="4" filter="url(#shadow)" />

  <!-- Middle Muscular Layer (Tunica Media) -->
  <circle cx="400" cy="300" r="195" fill="#3D2645" stroke="#8338EC" stroke-width="2.5" />

  <!-- Inner Endothelium (Tunica Intima) -->
  <circle cx="400" cy="300" r="160" fill="#1C1024" stroke="#FB5607" stroke-width="2" />

  <!-- Normal Lumen Channel -->
  <circle cx="400" cy="300" r="155" fill="url(#lumenGrad)" />

  <!-- Atherosclerotic Plaque Ingrowth (Lipid & Foam Cell Core) -->
  <path d="M 270,300 C 270,220 340,165 420,165 C 470,165 520,195 540,245 C 500,285 430,315 360,315 C 310,315 285,310 270,300 Z" fill="url(#plaqueGrad)" stroke="#FFE6A7" stroke-width="2" filter="url(#shadow)" />

  <!-- Fibrous Cap (Collagen Overcoat) -->
  <path d="M 270,300 C 310,312 370,315 420,300 C 470,285 515,260 540,245" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

  <!-- Circulating Erythrocytes (Red Blood Cells) -->
  <g fill="#D90429" stroke="#EF233C" stroke-width="1.5">
    <ellipse cx="380" cy="370" rx="16" ry="10" transform="rotate(-15 380 370)" />
    <ellipse cx="440" cy="360" rx="15" ry="9" transform="rotate(25 440 360)" />
    <ellipse cx="410" cy="415" rx="16" ry="10" transform="rotate(10 410 415)" />
    <ellipse cx="340" cy="390" rx="14" ry="8" transform="rotate(-30 340 390)" />
    <ellipse cx="475" cy="395" rx="15" ry="9" transform="rotate(40 475 395)" />
  </g>

  <!-- Annotations -->
  <g transform="translate(60, 80)">
    <rect width="180" height="40" rx="8" fill="#161F30" stroke="#8338EC" stroke-width="1.5" />
    <text x="90" y="25" fill="#E0AAFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Smooth Muscle Media</text>
  </g>
  <line x1="240" y1="100" x2="310" y2="160" stroke="#8338EC" stroke-width="1.5" stroke-dasharray="3,3" />

  <g transform="translate(560, 80)">
    <rect width="180" height="40" rx="8" fill="#161F30" stroke="#FFE6A7" stroke-width="1.5" />
    <text x="90" y="25" fill="#FFE6A7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lipid Core (Plaque)</text>
  </g>
  <line x1="560" y1="100" x2="440" y2="210" stroke="#FFE6A7" stroke-width="1.5" stroke-dasharray="3,3" />

  <g transform="translate(560, 480)">
    <rect width="180" height="40" rx="8" fill="#161F30" stroke="#EF233C" stroke-width="1.5" />
    <text x="90" y="25" fill="#FF758F" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Narrowed Lumen</text>
  </g>
  <line x1="560" y1="500" x2="450" y2="400" stroke="#EF233C" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>
