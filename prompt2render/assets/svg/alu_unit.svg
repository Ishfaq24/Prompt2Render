<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <!-- Trapezoidal ALU Symbol -->
  <polygon points="15,10 85,10 70,70 55,70 50,60 45,70 30,70" fill="#161b22" stroke="#a371f7" stroke-width="2.5"/>
  <text x="50" y="42" font-family="monospace" font-size="12" font-weight="bold" fill="#d2a8ff" text-anchor="middle">ALU</text>
  <!-- Input A/B indicators -->
  <line x1="30" y1="2" x2="30" y2="10" stroke="#8b949e" stroke-width="2"/>
  <line x1="70" y1="2" x2="70" y2="10" stroke="#8b949e" stroke-width="2"/>
  <!-- Output indicator -->
  <line x1="50" y1="70" x2="50" y2="78" stroke="#8b949e" stroke-width="2"/>
</svg>
