<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06D6A0" />
      <stop offset="45%" stop-color="#06D6A0" />
      <stop offset="55%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#EF476F" />
    </linearGradient>
    <filter id="ecgGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0B0F19" rx="16" />

  <!-- Medical Monitor Grid -->
  <g stroke="#1A2238" stroke-width="1">
    <line x1="50" y1="100" x2="750" y2="100" />
    <line x1="50" y1="150" x2="750" y2="150" />
    <line x1="50" y1="200" x2="750" y2="200" />
    <line x1="50" y1="250" x2="750" y2="250" />
    <line x1="50" y1="300" x2="750" y2="300" stroke="#283655" stroke-width="1.5" />
    <line x1="50" y1="350" x2="750" y2="350" />
    <line x1="50" y1="400" x2="750" y2="400" />
    <line x1="50" y1="450" x2="750" y2="450" />
    <line x1="50" y1="500" x2="750" y2="500" />

    <line x1="100" y1="80" x2="100" y2="520" />
    <line x1="200" y1="80" x2="200" y2="520" />
    <line x1="300" y1="80" x2="300" y2="520" />
    <line x1="400" y1="80" x2="400" y2="520" stroke="#283655" stroke-width="1.5" />
    <line x1="500" y1="80" x2="500" y2="520" />
    <line x1="600" y1="80" x2="600" y2="520" />
    <line x1="700" y1="80" x2="700" y2="520" />
  </g>

  <!-- Normal Baseline Complex (Left) -->
  <path d="M 60,300 L 120,300 Q 135,275 150,300 L 165,300 L 175,320 L 190,140 L 205,340 L 215,300 L 230,300 Q 255,250 280,300 L 320,300" fill="none" stroke="#06D6A0" stroke-width="3.5" stroke-linecap="round" filter="url(#ecgGlow)" />
  <text x="148" y="260" fill="#06D6A0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">P</text>
  <text x="190" y="125" fill="#06D6A0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">QRS</text>
  <text x="255" y="240" fill="#06D6A0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">T</text>
  <text x="190" y="380" fill="#A8DADC" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Normal Rhythm</text>

  <!-- Severe ST-Elevation STEMI Complex (Right) -->
  <path d="M 330,300 L 390,300 Q 405,275 420,300 L 435,300 L 445,330 L 460,110 L 475,230 L 515,225 Q 550,220 580,270 L 610,300 L 740,300" fill="none" stroke="url(#ecgGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#ecgGlow)" />

  <!-- ST Elevation Highlight Area -->
  <rect x="475" y="215" width="55" height="85" fill="#EF476F" opacity="0.25" rx="4" />
  <line x1="475" y1="300" x2="530" y2="300" stroke="#FFD166" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="500" y1="300" x2="500" y2="228" stroke="#EF476F" stroke-width="2.5" />
  <!-- Double arrow heads -->
  <polygon points="500,224 496,233 504,233" fill="#EF476F" />
  <polygon points="500,304 496,295 504,295" fill="#EF476F" />

  <!-- Critical STEMI Label -->
  <g transform="translate(430, 420)">
    <rect width="280" height="56" rx="10" fill="#590D22" stroke="#FF0054" stroke-width="2" />
    <text x="140" y="26" fill="#FFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">ACUTE INJURY CURRENT</text>
    <text x="140" y="46" fill="#FFCCD5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pathognomonic ST Elevation (STEMI)</text>
  </g>
</svg>
