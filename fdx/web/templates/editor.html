{% extends "base.html" %}
{% block title %}Script — {{ slug }}{% endblock %}
{% block content %}
<h1>Script: {{ slug }}</h1>

<div class="card">
  <label>Title <input id="meta-title" value="{{ script.meta.get('title', '') }}"></label>
  <label>Topic <input id="meta-topic" value="{{ script.meta.get('topic', '') }}"></label>
  <label>Audience <input id="meta-audience" value="{{ script.meta.get('audience', '') }}"></label>
</div>

<div id="sections"></div>

<div class="toolbar">
  <button id="add-section">+ Add section</button>
  <button id="draft-ai" class="secondary">Draft with AI</button>
  <button id="save-script" class="primary">Save script</button>
  <span id="pace-note"></span>
  <span id="save-status"></span>
</div>

<template id="section-template">
  <div class="section-card">
    <div class="section-head">
      <span class="section-num"></span>
      <input class="sec-title" placeholder="Section title">
      <button type="button" class="remove-section" title="Remove section">✕</button>
    </div>
    <label class="anim-label">ANIM
      <input class="sec-anim" placeholder="the central visual for this section">
    </label>
    <textarea class="sec-narration" rows="6"
             placeholder="What you actually say, in your own words."></textarea>
    <div class="sec-wordcount"></div>
    <div class="draft-badge" hidden>AI draft — not saved</div>
  </div>
</template>
{% endblock %}

{% block scripts %}
<script>
window.FDX_SLUG = {{ slug|tojson }};
window.FDX_SCRIPT = {{ script|tojson }};
</script>
{% endblock %}
