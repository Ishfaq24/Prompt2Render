{% extends "base.html" %}
{% block title %}Pipeline — {{ slug }}{% endblock %}
{% block content %}
<h1>Pipeline: {{ slug }}</h1>

<div class="stage-grid">
  {% for stage in stages %}
  <button class="stage-btn" data-stage="{{ stage }}">
    <span class="name">{{ stage }}</span>
    <span class="status">
      {% if stage == 'voice' %}{{ 'done' if status.voiced else 'not run' }}
      {% elif stage == 'align' %}{{ status.aligned }}/{{ status.aligned_total }}
      {% elif stage == 'scenes' %}{{ status.storyboarded }}/{{ status.storyboarded_total }}
      {% elif stage == 'plan' %}{{ 'done' if status.planned else 'not run' }}
      {% elif stage == 'encode' %}{{ status.encoded }}/{{ status.encoded_total }}
      {% elif stage == 'finish' %}{{ 'done' if status.finished else 'not run' }}
      {% elif stage == 'check' %}{{ 'done' if status.checked else 'not run' }}
      {% else %}{{ '' }}{% endif %}
    </span>
  </button>
  {% endfor %}
</div>

<div class="toolbar">
  <button id="build-all" class="primary">Build all (voice → align → scenes → stills → plan → encode → finish → check)</button>
</div>

<div id="job-panel" class="card" {% if not current %}hidden{% endif %}>
  <div class="toolbar">
    <strong>{{ current.stage if current else '' }}</strong>
    <span class="job-status {{ current.status if current else '' }}">{{ current.status if current else '' }}</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="fill" style="width:0%"></div></div>
    <div class="progress-note"></div>
  </div>
  <div class="log-panel"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
window.FDX_SLUG = {{ slug|tojson }};
window.FDX_CURRENT_JOB = {{ current|tojson }};
</script>
{% endblock %}
