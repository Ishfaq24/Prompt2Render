<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}fdx-studio{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">fdx-studio</a>
  {% if slug %}
  <span class="sep">/</span>
  <a href="/projects/{{ slug }}/script">Script</a>
  <a href="/projects/{{ slug }}/pipeline">Pipeline</a>
  <a href="/projects/{{ slug }}/scenes">Scenes</a>
  <a href="/projects/{{ slug }}/upload">Upload</a>
  <a href="/projects/{{ slug }}/review">Review</a>
  {% endif %}
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
